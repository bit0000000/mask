<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tomb of the Mask</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mask">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="https://images.weserv.nl/?url=bit0000000.github.io/yueliang/tomb/icon.svg&w=192&output=png">

<!-- Share preview -->
<meta property="og:title" content="Tomb of the Mask">
<meta property="og:description" content="Slide through the maze. Collect every dot. Avoid the spikes.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://images.weserv.nl/?url=bit0000000.github.io/yueliang/tomb/icon.svg&w=512&output=png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tomb of the Mask">
<meta name="twitter:description" content="Slide through the maze. Collect every dot. Avoid the spikes.">
<meta name="twitter:image" content="https://images.weserv.nl/?url=bit0000000.github.io/yueliang/tomb/icon.svg&w=512&output=png">

<!-- Pre-paint theme to avoid flash on dark mode -->
<script>
(function(){
  try {
    var s = localStorage.getItem('mask-theme');
    var dark = s ? s === 'dark' : true;
    document.documentElement.style.background = dark ? '#0a1226' : '#f5f7fb';
    document.documentElement.style.color = dark ? '#e2e8f7' : '#0f1e3d';
  } catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="stat score">SCORE <span id="score">0</span></div>
    <div class="stat coins">◈ <span id="coins">0</span></div>
    <div class="stat chain" id="chainDisplay"></div>
    <div class="lvl" id="lvlDisplay">LV 1</div>
    <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    <button class="icon-btn" id="themeBtn" title="Theme">☾</button>
    <button class="icon-btn" id="pauseBtn" title="Pause">❚❚</button>
  </div>
  <div class="game-wrap">
    <canvas id="game"></canvas>
    <div class="toast" id="toast"></div>

    <div class="overlay show" id="menuOverlay">
      <h2>Tomb of the Mask</h2>
      <p class="best-line" id="menuBest">BEST 0 · LEVEL 1</p>
      <p>Pick a mask.</p>
      <div class="mask-grid" id="maskGrid"></div>
      <div class="mode-row">
        <button class="btn mode-btn active" id="modeStage">STAGE</button>
        <button class="btn mode-btn" id="modeArcade">ARCADE</button>
      </div>
      <button class="btn" id="playBtn">START</button>
      <button class="btn ghost small" id="practiceBtn" style="display:none"></button>
      <p style="font-size:.68rem;margin-top:6px">Coins: <span id="menuCoins">0</span></p>
    </div>

    <div class="overlay" id="shopOverlay">
      <h2>Level <span id="shopLevel">1</span> cleared</h2>
      <p>Buy supplies with <span style="color:var(--coin)">◈ coins</span>.</p>
      <div class="shop-grid" id="shopGrid"></div>
      <button class="btn" id="nextLevelBtn" style="margin-top:4px">NEXT LEVEL</button>
    </div>

    <div class="overlay" id="deadOverlay">
      <h2 id="deadTitle">You died</h2>
      <p id="deadMsg">Score: 0</p>
      <div class="stats" id="deadStats"></div>
      <button class="btn" id="retryBtn">TRY AGAIN</button>
      <button class="btn ghost small" id="menuBtn">MENU</button>
    </div>

    <div class="overlay" id="pauseOverlay">
      <h2>Paused</h2>
      <p id="pauseInfo"></p>
      <button class="btn" id="resumeBtn">RESUME</button>
      <button class="btn ghost small" id="quitBtn">QUIT TO MENU</button>
    </div>

    <div class="overlay" id="settingsOverlay">
      <h2>Settings</h2>
      <div class="settings-grid">
        <label class="setting-row"><span>Sound effects</span><input type="checkbox" id="setSound"></label>
        <label class="setting-row"><span>Vibration</span><input type="checkbox" id="setHaptics"></label>
        <label class="setting-row"><span>Player trail</span><input type="checkbox" id="setTrail"></label>
        <label class="setting-row"><span>Reduced motion</span><input type="checkbox" id="setMotion"></label>
      </div>
      <button class="btn" id="settingsClose">DONE</button>
      <button class="btn ghost small" id="resetProgress">RESET PROGRESS</button>
    </div>
  </div>
  <div class="legend">
    <span><i style="background:var(--coin)"></i>Coin</span>
    <span><i style="background:var(--accent)"></i>Dot</span>
    <span><i style="background:var(--danger)"></i>Spike</span>
    <span><i style="background:var(--bat)"></i>Bat</span>
    <span><i style="background:var(--puffer)"></i>Puffer</span>
    <span><i style="background:var(--dart)"></i>Dart</span>
    <span><i style="background:var(--saw)"></i>Saw</span>
    <span><i style="background:var(--snake)"></i>Snake</span>
    <span><i style="background:var(--lava)"></i>Lava</span>
  </div>
  <div class="hint">SWIPE · ARROWS · WASD</div>
</div>

<script src="config.js"></script>
<script src="masks.js"></script>
<script src="state.js"></script>
<script src="audio.js"></script>
<script src="effects.js"></script>
<script src="chunks.js"></script>
<script src="lava.js"></script>
<script src="levels.js"></script>
<script src="arcade.js"></script>
<script src="hazards.js"></script>
<script src="render.js"></script>
<script src="ui.js"></script>
<script src="input.js"></script>
<script src="game.js"></script>
</body>
</html>
